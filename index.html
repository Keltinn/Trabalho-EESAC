<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identidade Escolar - Campanha Fotográfica</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&family=Special+Elite&display=swap');

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #fdf6e3; 
            color: #433422;
        }

        /* Banner Principal */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1542038784456-1ea8e935640e?q=80&w=1470&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            border-bottom: 10px solid #d4a373;
        }

        .hero h1 {
            font-family: 'Special Elite', cursive;
            font-size: 3.5rem;
            margin: 10px 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Botões */
        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .cta-button {
            background-color: #bc6c25;
            color: white;
            padding: 18px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(188, 108, 37, 0.4);
        }

        .cta-button.pdf {
            background-color: #606c38;
            box-shadow: 0 4px 15px rgba(96, 108, 56, 0.4);
        }

        .cta-button:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        /* Seção de Fotos Pré-selecionadas */
        .galeria-container {
            padding: 60px 10%;
            text-align: center;
            background-color: #fefae0;
        }

        .galeria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .foto-card {
            background: white;
            padding: 15px 15px 40px 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transform: rotate(-2deg);
            transition: 0.3s;
        }

        .foto-card:nth-child(even) { transform: rotate(2deg); }

        .foto-card:hover {
            transform: rotate(0deg) scale(1.05);
            z-index: 10;
        }

        .foto-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            filter: sepia(20%);
        }

        .foto-card p {
            font-family: 'Special Elite', cursive;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        /* Categorias e Footer mantidos... */
        .chamada { padding: 50px 10%; text-align: center; }
        .categorias { display: flex; flex-wrap: wrap; justify-content: space-around; padding: 50px 5%; background-color: #e9edc9; }
        .categoria-card { background: white; width: 280px; padding: 20px; margin: 15px; border-radius: 15px; text-align: center; border-bottom: 5px solid #bc6c25; }
        footer { background: #283618; color: #fefae0; padding: 30px; text-align: center; }
    </style>
</head>
<body>

<section class="hero">

    <p>Sua visão transforma o comum em arte.</p>
